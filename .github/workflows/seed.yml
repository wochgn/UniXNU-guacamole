name: data-seed

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Data seed with Preboot volume
        run: bash scripts/build-data-seed-macos.sh build/data-seed

      - name: Upload seed artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-seed
          path: |
            build/data-seed/data-seed.dbr
            build/data-seed/data-seed.json
          if-no-files-found: error
