# OnePlus 7 Pro (guacamole, SM8150) device repository for UniXNU.
# The kernel is built in the ios-sweet tree and passed with --kernel; this
# board file drives the firmware, payload and boot-image steps.

[board]
name = "guacamole"
soc = "SM8150"
description = "OnePlus 7 Pro (GM1910)"
kit = "guacamole"

[firmware]
config = "guacamole"
dsc = "Platforms/SurfaceDuo1Pkg/SurfaceDuo1NoSb.dsc"
fd = "Build/SurfaceDuo1Pkg/{target}_CLANGPDB/FV/SM8150_EFI.fd"
submodules = [
  "MU_BASECORE",
  "Common/MU",
  "Common/MU_OEM_SAMPLE",
  "Platforms/CranePkg",
  "Platforms/SurfaceDuoACPI",
  "Features/DFCI",
  "Features/CONFIG",
  "Binaries",
  "Platforms/OpensslPkg/Library/OpensslLib/openssl",
  "Platforms/MbedTlsPkg/Library/MbedTlsLib/mbedtls",
]
packages = [
  "{uefi}/Platforms",
  "{uefi}/Common/MU",
  "{uefi}/Common/MU_OEM_SAMPLE",
  "{uefi}/Features/DFCI",
  "{uefi}/Features/CONFIG",
  "{uefi}/Binaries",
  "{uefi}/Silicon/QC/Sm8150",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]

[firmware.defines]
TARGET_DEVICE = "oneplus-guacamole"
FDT = "guacamole.dtb"
SHARED_CRYPTO_PATH = "{edk2}/CryptoPkg/Binaries/edk2-basecrypto-driver-bin_extdep"
CONF_AUTOGEN_INCLUDE_PATH = "{uefi}/Common/MU/AndromedaPkg/Include"
MU_SCHEMA_DIR = "{uefi}/Common/MU/AndromedaPkg/CfgData"
MU_SCHEMA_FILE_NAME = "AndromedaPkgCfgData.xml"

# The target OS image: the unchanged iPad7,1 iPadOS 17.7.11 restore image.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"


[userdata]
# The phone's "userdata" GPT partition (observed: first block 0x1b188, 22278 MiB,
# 4 KiB sectors). The SHNGROOT image is flashed here: the unchanged OS and
# SystemOS disk images of the IPSW (whole disk images, GPT included, per
# docs/zh/guide/userdata) behind a manifest; the kernel's UFS driver exposes the
# first window (OS) as the root block device and the partition scheme publishes
# the APFS partition inside it.
# Observed live by the NativeUfs probe=11 read of LUN 0 ("userdata" GPT entry).
first_lba = 0x1db188
last_lba = 0x3a907fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
# 4 KiB BCM2837 build with the xnu-10063.141.1 (iPadOS 17.7.11) source.
defconfig = "guacamole_10063_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py GuacMedia",
  "build-libpthread-kernel.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.filesystems.hfs.kext",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

[payload]
volume = "GUACESP"
size_mib = 76
loader = "firmware"
title = "OnePlus 7 Pro - XNU"
dram_size = "0xc0000000"
panic_screen = false
timeout = 3
# Trust caches the payload may carry into the boot (DarwinBoot places the
# cache and rewrites the ADT placeholder). The value is the
# scripts/pack-trust-bundle.py bundle of the IPSW OS StaticTrustCache plus the
# Cryptex1,SystemOS trust cache; it equals UniXNU's original-static-system
# bundle hash.
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
]
kernel_args = [
  # Console and diagnostics (the sheng reference set).
  "-v",
  "debug=0x14e",
  "serial=3",
  "keepsyms=1",
  "kt_fixed_zones=120",
  # Root selection and the iOS APFS layout.
  "rd=uuid",
  "boot-uuid=04769D26-2CA0-4825-B443-E2E5F88300F2",
  "-apfs_shared_datavolume",
  "native-ufs-root=1",
  # Board integration.
  "sheng-pmgr=2",
  "kernel_stack_pages=32",
  # Userland bring-up.
  "launchd_unsecure_cache=1",
  "ignition_level=1",
  "ignition_force_dylib_root=rootfs",
  "owner-dyld-no-ignition=0",
  "wdt=-1",
  "root-live-fs=1",
  "allow-root-hash-mismatch=1",
]

[payload.adt]
tool = "scripts/make-guacamole-adt.py"
packed_data_ramdisk = true
persistent_data = true
unique_chip_id = "required"
ipad_identity = true
chip_id = "207"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
# Match the working shim window. 256 MiB leaves too little room in arm_vm_init's
# early I/O page-table reservation for the 0x2400000-byte framebuffer; 3 GiB
# also gives XNU the full kernel-managed RAM range.
owned_memory_size = "0xc0000000"

[bootimg.image]
base = 0x0
kernel_offset = 0x8000
# The ABL adds abl_base (the "Kernel" RAM region at 0x80000000) to these
# offsets. 0x1000000 would put a 32 MiB payload at 0x81000000-0x83000000,
# past the 0x82A00000 end of the reserved Kernel region into the DBI MMIO
# window, so the ABL does not load it. 0x800000 puts it at
# 0x80800000-0x82800000, after the ~5 MiB kernel/DTB and inside the region.
# The owner-signed kernel embeds ~17 MiB of block hashes (16 KiB policy
# blocks), so the payload is placed above the DBI MMIO window at
# 0x84000000-0x88c00000, still below the 0x9c000000 DarwinBoot window;
# boot_a is 0x6000000 (96 MiB) and the ABL refuses images above that.
ramdisk_offset = 0x4000000
abl_base = 0x80000000
tags_offset = 0x100
pagesize = 4096
header_version = 0
